name: Verify documentation candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read pinned product revision
        id: candidate
        run: |
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const { revision, source } = JSON.parse(readFileSync('library-candidate.json'));
            if (!/^[0-9a-f]{40}$/.test(revision)) throw Error('Pin an exact library commit');
            if (source !== undefined && source !== 'registry') throw Error('Unknown library source');
            appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + revision + '\n');
            appendFileSync(process.env.GITHUB_OUTPUT, 'source=' + (source || 'candidate') + '\n');
          "
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.candidate.outputs.source != 'registry'
        with:
          repository: inkrajs/inkra
          ref: ${{ steps.candidate.outputs.revision }}
          path: .library
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
      - run: npm run build
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
      - run: GITHUB_SHA="$LIBRARY_REVISION" npm run check:package
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
        env:
          LIBRARY_REVISION: ${{ steps.candidate.outputs.revision }}
      - run: npm run prepare:library -- .library --lockfile-only
        if: steps.candidate.outputs.source != 'registry'
      - run: git diff --exit-code -- library-candidate.json package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-browser-input
          path: |
            package.json
            package-lock.json
            library-candidate.json
            vendor/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-candidate
          path: |
            dist/
            library-candidate.json
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-browser-input
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Installed-package browser smoke
        run: bash scripts/run-browser-ci.sh
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-browser-report-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  # Keep the required check name stable; all shards must finish successfully.
  docs:
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docs-browser-report-*
          path: .ci-results
          merge-multiple: true
      - name: Require complete browser coverage
        run: node scripts/check-browser-reports.mjs .ci-results 4
