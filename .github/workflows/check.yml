name: Verify documentation candidate
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      run_browser:
        description: Run optional browser and contract tests
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  local-validation:
    name: Resolve trusted local tests
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.resolve.outputs.accepted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-ci
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Resolve declaration using trusted base code and GitHub editor identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OUTPUT_PATH: .ci-plan/local-validation.json
        shell: bash
        run: |
          mkdir -p .ci-plan
          if [[ -f .trusted-ci/scripts/resolve-pr-local-validation.mjs ]]; then
            node .trusted-ci/scripts/resolve-pr-local-validation.mjs
          else
            node -e 'require("fs").writeFileSync(process.env.OUTPUT_PATH, JSON.stringify({accepted:false,declarations:[],reasons:[{code:"policy-bootstrap",detail:"Base revision has no local-validation policy; normal CI runs"}]}))'
          fi
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"accepted="+JSON.parse(require("fs").readFileSync(process.env.OUTPUT_PATH)).accepted+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-validation
          path: .ci-plan/local-validation.json
          include-hidden-files: true
          if-no-files-found: error
  build:
    needs: local-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      browser_requested: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser }}
      browser_matrix: ${{ steps.browser-plan.outputs.matrix }}
      browser_shard_count: ${{ steps.browser-plan.outputs.shard_count }}
      browser_selected_count: ${{ steps.browser-plan.outputs.selected_count }}
      browser_plan_digest: ${{ steps.browser-plan.outputs.plan_digest }}
      tested_revision: ${{ steps.browser-plan.outputs.tested_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned product revision
        id: candidate
        run: |
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const { revision, source } = JSON.parse(readFileSync('library-candidate.json'));
            if (!/^[0-9a-f]{40}$/.test(revision)) throw Error('Pin an exact library commit');
            if (source !== undefined && source !== 'registry') throw Error('Unknown library source');
            appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + revision + '\n');
            appendFileSync(process.env.GITHUB_OUTPUT, 'source=' + (source || 'candidate') + '\n');
          "
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.candidate.outputs.source != 'registry'
        with:
          repository: inkrajs/inkra
          ref: ${{ steps.candidate.outputs.revision }}
          path: .library
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
      - run: npm run build
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
      - run: GITHUB_SHA="$LIBRARY_REVISION" npm run check:package
        if: steps.candidate.outputs.source != 'registry'
        working-directory: .library
        env:
          LIBRARY_REVISION: ${{ steps.candidate.outputs.revision }}
      - run: npm run prepare:library -- .library --lockfile-only
        if: steps.candidate.outputs.source != 'registry'
      - run: git diff --exit-code -- library-candidate.json package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser
      - run: npm run build
      - name: Resolve candidate-bound local browser declarations
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          OUTPUT_PATH: .ci-plan/local-validation.json
        shell: bash
        run: |
          mkdir -p .ci-plan
          export EXPECTED_CANDIDATE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("library-candidate.json")).sha256')"
          node scripts/resolve-pr-local-validation.mjs
      - name: Select affected browser checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser
        id: browser-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          BASE_SHA="$(node -p 'JSON.parse(require("fs").readFileSync(".ci-plan/local-validation.json")).base || process.env.TESTED_SHA')"
          node scripts/select-browser-checks.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --tested "$TESTED_SHA" --pr-head "$PR_HEAD_SHA" --output .ci-plan/browser-selection.json
          node scripts/browser-local-validation.mjs --plan .ci-plan/browser-selection.json --attestation .ci-plan/local-validation.json --candidate library-candidate.json
          cp library-candidate.json .ci-plan/library-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser
        with:
          name: docs-browser-plan
          path: .ci-plan/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser
        with:
          name: docs-browser-input
          path: |
            package.json
            package-lock.json
            library-candidate.json
            vendor/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-candidate
          path: |
            dist/
            library-candidate.json
          if-no-files-found: error

  browser:
    needs: build
    if: needs.build.outputs.browser_requested == 'true' && needs.build.outputs.browser_selected_count != '0'
    runs-on: ubuntu-latest
    # Matches package-lock.json Playwright 1.64.1; MCR registry index verified 2026-10-26.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-browser-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-browser-plan
          path: .ci-plan
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm dependencies and verify image Chromium
        shell: bash
        run: |
          started=$SECONDS
          npm ci --ignore-scripts
          node --input-type=module -e "
            import { chromium } from 'playwright';
            const browser = await chromium.launch({ headless: true });
            console.log('Launched preinstalled Chromium ' + browser.version());
            await browser.close();
          "
          printf 'Browser shard setup: %ss (npm ci plus preinstalled Chromium launch).\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Installed-package browser smoke
        run: bash scripts/run-browser-ci.sh
        env:
          BROWSER_SELECTION_PLAN: .ci-plan/browser-selection.json
          BROWSER_SHARD: ${{ matrix.shard }}/${{ needs.build.outputs.browser_shard_count }}
          EXPECTED_BROWSER_PLAN_DIGEST: ${{ needs.build.outputs.browser_plan_digest }}
          EXPECTED_TESTED_REVISION: ${{ needs.build.outputs.tested_revision }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-browser-report-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  # Keep the required check name stable; browser coverage is opt-in.
  docs:
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.build.outputs.browser_requested == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.build.outputs.browser_requested == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.outputs.browser_requested == 'true'
        with:
          name: docs-browser-plan
          path: .ci-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.outputs.browser_requested == 'true' && needs.build.outputs.browser_selected_count != '0'
        with:
          pattern: docs-browser-report-*
          path: .ci-results
          merge-multiple: true
      - name: Require complete browser coverage
        if: needs.build.outputs.browser_requested == 'true'
        env:
          BROWSER_JOB_RESULT: ${{ needs.browser.result }}
          EXPECTED_BROWSER_PLAN_DIGEST: ${{ needs.build.outputs.browser_plan_digest }}
          EXPECTED_TESTED_REVISION: ${{ needs.build.outputs.tested_revision }}
        shell: bash
        run: |
          export EXPECTED_CANDIDATE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync(".ci-plan/library-candidate.json")).sha256')"
          node scripts/check-browser-reports.mjs .ci-results .ci-plan/browser-selection.json
